packages:
  - '**'
  - '!dist'
  - '!**/dist/**'
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  esbuild: false
  msw: false
  prisma: true
  sharp: false
minimumReleaseAgeExclude:
  - '@umami/react-zen'
  - cn@0.2.6
  - '@umami/api-client@0.81.0'
  - browserslist@4.29.4
  - '@biomejs/biome@2.6.2'
  - '@biomejs/cli-android-arm64@2.6.2'
  - '@biomejs/cli-android-x64@2.6.2'
  - '@biomejs/cli-darwin-arm64@2.6.2'
  - '@biomejs/cli-darwin-x64@2.6.2'
  - '@biomejs/cli-linux-arm64-musl@2.6.2'
  - '@biomejs/cli-linux-arm64@2.6.2'
  - '@biomejs/cli-linux-x64-musl@2.6.2'
  - '@biomejs/cli-linux-x64@2.6.2'
  - '@biomejs/cli-win32-arm64@2.6.2'
  - '@biomejs/cli-win32-x64@2.6.2'
  - '@rollup/plugin-terser@1.0.2'
  - immer@11.2.7
  - lucide-react@1.61.0
  - react-window@2.5.0

# Security floors for transitive dependencies whose parents still allow affected versions.
overrides:
  '@babel/core@<7.29.6': 8.0.10
  'brace-expansion@<1.1.21': 5.0.12
  'brace-expansion@>=2.0.0 <2.1.7': 5.0.12
  'browserslist@<4.28.7': 4.29.4
  'd3-color@<3.1.0': 3.1.0
  'deepmerge-ts@<8.0.0': 8.0.2
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  'fast-uri@>=3.0.0 <3.1.8': 4.2.3
  'fflate@>=0.4.5 <0.4.9': 0.8.3
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=5.0.0 <5.1.8': 5.1.9
  'minimatch@>=9.0.0 <9.0.7': 11.0.1
  'mysql2@<3.23.1': 3.24.6
  'picomatch@>=4.0.0 <4.0.4': ^4.0.4
  'shell-quote@<1.9.0': 1.9.0
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'sharp@<0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=8.0.0 <8.10.2': 8.12.3
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'vite@>=8.0.0 <8.0.16': 8.3.5
