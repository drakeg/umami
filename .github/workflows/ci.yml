name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'deps/consolidated-latest' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/consolidated-latest
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Restore react-window lockfile
        run: |
          cp pnpm-workspace.yaml /tmp/pnpm-workspace.yaml
          python - <<'PY'
          from pathlib import Path
          p = Path("pnpm-workspace.yaml")
          p.write_text("minimumReleaseAge: 0\n" + p.read_text())
          PY
          pnpm update --lockfile-only react-window@2.5.0
          cp /tmp/pnpm-workspace.yaml pnpm-workspace.yaml
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: restore react-window 2.5.0 lockfile"
          git push origin HEAD:deps/consolidated-latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:generate
      - run: pnpm openapi:check --explicit
      - run: pnpm check:api:client
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm build
