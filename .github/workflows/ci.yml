name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

permissions:
  contents: write

jobs:
  refresh-consolidated-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'deps/consolidated-post-merge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/consolidated-post-merge
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Refresh lockfile-only dependency updates
        run: |
          pnpm update --lockfile-only rrweb @types/node postcss
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: absorb remaining dependency lockfile updates"
          git push origin HEAD:deps/consolidated-post-merge

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:generate
      - run: pnpm openapi:check --explicit
      - run: pnpm check:api:client
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm build
