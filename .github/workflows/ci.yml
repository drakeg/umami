# Build the legacy Umami application on a currently supported Node.js release.
# Keep both database variants covered until the application is upgraded to a newer Umami release.

name: Node.js CI

on:
  push:
  pull_request:

env:
  SKIP_DB_CHECK: 1

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db-type:
          - postgresql
          - mysql

    env:
      DATABASE_TYPE: ${{ matrix.db-type }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
