name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  validate-aggregate:
    if: github.event_name == 'pull_request' && github.head_ref == 'deps/consolidated-current-prs'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Temporarily allow only the not-yet-aged target versions for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pnpm-workspace.yaml")
          s = p.read_text()
          marker = "minimumReleaseAgeExclude:\n"
          insert = "  - '@rollup/plugin-typescript@12.3.1'\n  - zustand@5.0.16\n  - immer@11.2.9\n"
          s = s.replace(marker, marker + insert, 1)
          p.write_text(s)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:generate
      - run: pnpm openapi:check --explicit
      - run: pnpm check:api:client
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm build

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:generate
      - run: pnpm openapi:check --explicit
      - run: pnpm check:api:client
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm build
