name: Consolidate dependency lockfile

on:
  push:
    branches:
      - deps/consolidated-updates

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deps/consolidated-updates
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh consolidated dependency lockfile
        run: |
          pnpm update --lockfile-only --no-frozen-lockfile \
            react react-dom babel-plugin-react-compiler \
            @netlify/plugin-nextjs @playwright/test @tanstack/react-query \
            @types/node jsdom postcss lucide-react
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml package.json pnpm-workspace.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json pnpm-workspace.yaml
          git commit -m "chore: consolidate dependency updates"
          git push origin HEAD:deps/consolidated-updates
