name: Import Umami v3.4.0

on:
  push:
    branches:
      - upgrade/umami-3.4.0
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy source with released upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/umami-software/umami.git
          git fetch --depth=1 upstream tag v3.4.0

          git rm -r .
          git checkout FETCH_HEAD -- .

          # Keep downstream dependency automation.
          cat > renovate.json <<'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "extends": ["config:recommended"]
          }
          EOF

          # Upstream deployment workflows are specific to umami-software.
          rm -f .github/workflows/cd.yml .github/workflows/cd-cloud.yml

          # Adapt upstream CI so it actually runs in this downstream repository.
          cat > .github/workflows/ci.yml <<'EOF'
          name: Node.js CI

          on:
            push:
            pull_request:

          env:
            DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
            SKIP_DB_CHECK: 1

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 12.3.4
                    run_install: false
                - name: Use Node.js 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: "pnpm"
                - run: pnpm install --frozen-lockfile
                - run: pnpm openapi:generate
                - run: pnpm openapi:check --explicit
                - run: pnpm check:api:client
                - run: pnpm build:packages
                - run: pnpm test
                - run: pnpm test:packages
                - run: pnpm build
          EOF

          git add -A
          git commit -m "feat: synchronize with Umami v3.4.0"
          git push origin HEAD:upgrade/umami-3.4.0
